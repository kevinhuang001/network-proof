name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  typescript-and-tests:
    name: TypeScript, unit, protocol and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: node scripts/verify-extension.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: extension-unpacked
          path: apps/extension/dist/
          if-no-files-found: error

  android-debug:
    name: Android debug build and native tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: apps/hardware/android/**/*.gradle*
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @netproof/hardware build
      - run: pnpm --filter @netproof/hardware exec cap sync android
      - name: Native unit tests and debug APK
        working-directory: apps/hardware/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug
      - name: Check Android offline security permissions
        run: |
          set -euo pipefail
          APK=apps/hardware/android/app/build/outputs/apk/debug/app-debug.apk
          test -f "$APK"
          DUMP="$(aapt dump permissions "$APK")"
          echo "$DUMP" | grep -q android.permission.CAMERA
          if echo "$DUMP" | grep -q android.permission.INTERNET; then
            echo "::error::Air-gapped APK declares INTERNET"; exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: apps/hardware/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
