name: Signed release

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netproof-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign and publish v0.2.1
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      TAG: v0.2.1
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: apps/hardware/android/**/*.gradle*
      - name: Configure preinstalled Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(command -v sdkmanager || find "$ANDROID_HOME/cmdline-tools" -maxdepth 3 -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0"
          echo "$ANDROID_HOME/build-tools/36.0.0" >> "$GITHUB_PATH"
      - run: pnpm install --frozen-lockfile
      - name: Run entire TS verification suite
        run: pnpm verify
      - run: node scripts/verify-extension.mjs
      - run: pnpm --filter @netproof/hardware exec cap sync android
      - name: Build unsigned release APK and native unit tests
        working-directory: apps/hardware/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Package verified Chrome extension
        run: |
          set -euo pipefail
          mkdir -p release
          (cd apps/extension/dist && zip -qr "$GITHUB_WORKSPACE/release/netproof-companion-extension-0.2.1.zip" .)
          (cd release && sha256sum netproof-companion-extension-0.2.1.zip > SHA256SUMS.txt)
      - name: Publish extension pre-release before Android signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" release/netproof-companion-extension-0.2.1.zip release/SHA256SUMS.txt \
              --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
              --title "NetProof $TAG (Android signing pending)" \
              --notes-file docs/RELEASE_NOTES.md \
              --prerelease
          else
            echo "Release $TAG already exists; preserving existing assets."
          fi
      - name: Sign with existing GitHub Actions keystore secret
        env:
          KEYSTORE_BASE64: ${{ secrets.NP_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NP_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NP_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NP_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Missing existing signing keystore/password secrets; refusing to publish unsigned or prototype-signed APK."
            exit 1
          fi
          if [[ -z "$KEY_PASSWORD" ]]; then KEY_PASSWORD="$STORE_PASSWORD"; fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netproof-release.jks"
          test -s "$RUNNER_TEMP/netproof-release.jks"
          APK_IN=apps/hardware/android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p release
          zipalign -f -p 4 "$APK_IN" "$RUNNER_TEMP/aligned.apk"
          NP_SIGN_STORE_PASSWORD="$STORE_PASSWORD" NP_SIGN_KEY_PASSWORD="$KEY_PASSWORD" \
            apksigner sign --ks "$RUNNER_TEMP/netproof-release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:NP_SIGN_STORE_PASSWORD \
              --key-pass env:NP_SIGN_KEY_PASSWORD \
              --out release/netproof-air-0.2.1.apk "$RUNNER_TEMP/aligned.apk"
          apksigner verify --verbose release/netproof-air-0.2.1.apk
          DUMP="$(aapt dump permissions release/netproof-air-0.2.1.apk)"
          echo "$DUMP" | grep -q android.permission.CAMERA
          if echo "$DUMP" | grep -q android.permission.INTERNET; then
            echo "::error::Air-gapped APK declares INTERNET"; exit 1
          fi
          rm -f "$RUNNER_TEMP/netproof-release.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Complete release checksums
        run: |
          set -euo pipefail
          (cd release && sha256sum netproof-air-0.2.1.apk netproof-companion-extension-0.2.1.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: netproof-signed-release
          path: release/
          if-no-files-found: error
      - name: Attach signed APK and publish final release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/netproof-air-0.2.1.apk release/SHA256SUMS.txt --clobber
            gh release edit "$TAG" --title "NetProof $TAG" --prerelease=false --latest
          else
            gh release create "$TAG" release/* \
              --target "${{ github.event.workflow_run.head_sha || github.sha }}" \
              --title "NetProof $TAG" \
              --notes-file docs/RELEASE_NOTES.md \
              --latest
          fi
