name: Signed release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: netproof-release
  cancel-in-progress: false

jobs:
  publish:
    name: Build, sign and publish v0.2.0
    runs-on: ubuntu-latest
    env:
      TAG: v0.2.0
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: apps/hardware/android/**/*.gradle*
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - run: pnpm install --frozen-lockfile
      - name: Run entire TS verification suite
        run: pnpm verify
      - run: node scripts/verify-extension.mjs
      - run: pnpm --filter @netproof/hardware exec cap sync android
      - name: Build unsigned release APK and native unit tests
        working-directory: apps/hardware/android
        run: ./gradlew --no-daemon testDebugUnitTest assembleRelease

      - name: Sign with existing GitHub Actions keystore secret
        env:
          KEYSTORE_BASE64: ${{ secrets.NP_KEYSTORE_BASE64 || secrets.ANDROID_KEYSTORE_BASE64 || secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NP_KEYSTORE_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD || secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.NP_KEY_PASSWORD || secrets.ANDROID_KEY_PASSWORD || secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NP_KEY_ALIAS || secrets.ANDROID_KEY_ALIAS || 'netproof' }}
        run: |
          set -euo pipefail
          if [[ -z "$KEYSTORE_BASE64" || -z "$STORE_PASSWORD" ]]; then
            echo "::error::Missing existing signing keystore/password secrets; refusing to publish unsigned or prototype-signed APK."
            exit 1
          fi
          if [[ -z "$KEY_PASSWORD" ]]; then KEY_PASSWORD="$STORE_PASSWORD"; fi
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/netproof-release.jks"
          test -s "$RUNNER_TEMP/netproof-release.jks"
          APK_IN=apps/hardware/android/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p release
          zipalign -f -p 4 "$APK_IN" "$RUNNER_TEMP/aligned.apk"
          NP_SIGN_STORE_PASSWORD="$STORE_PASSWORD" NP_SIGN_KEY_PASSWORD="$KEY_PASSWORD" \
            apksigner sign --ks "$RUNNER_TEMP/netproof-release.jks" \
              --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:NP_SIGN_STORE_PASSWORD \
              --key-pass env:NP_SIGN_KEY_PASSWORD \
              --out release/netproof-air-0.2.0.apk "$RUNNER_TEMP/aligned.apk"
          apksigner verify --verbose release/netproof-air-0.2.0.apk
          DUMP="$(aapt dump permissions release/netproof-air-0.2.0.apk)"
          echo "$DUMP" | grep -q android.permission.CAMERA
          if echo "$DUMP" | grep -q android.permission.INTERNET; then
            echo "::error::Air-gapped APK declares INTERNET"; exit 1
          fi
          rm -f "$RUNNER_TEMP/netproof-release.jks" "$RUNNER_TEMP/aligned.apk"

      - name: Package verified Chrome extension
        run: |
          set -euo pipefail
          mkdir -p release
          (cd apps/extension/dist && zip -qr "$GITHUB_WORKSPACE/release/netproof-companion-extension-0.2.0.zip" .)
          (cd release && sha256sum netproof-air-0.2.0.apk netproof-companion-extension-0.2.0.zip > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: netproof-signed-release
          path: release/
          if-no-files-found: error
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; refusing to overwrite published binaries."
            exit 0
          fi
          gh release create "$TAG" release/* \
            --target "$GITHUB_SHA" \
            --title "NetProof $TAG" \
            --notes-file docs/RELEASE_NOTES.md \
            --latest
